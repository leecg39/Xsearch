services:
  app:
    build:
      context: ./app
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 8787
      NEWSGEN_OUTPUT_DIR: /app/newsgen/output
      NEWSGEN_APPROVAL_MODE: client
    volumes:
      - ./data/output:/app/newsgen/output
      - ./data/auth:/app/newsgen/.auth
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    security_opt:
      - no-new-privileges:true
    mem_limit: 1g
    cpus: 1.5
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - fetch('http://127.0.0.1:8787/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
    labels:
      traefik.enable: "true"
      traefik.http.services.xsearch-news.loadbalancer.server.port: "8787"

      traefik.http.routers.xsearch-news-public-v2.rule: Host(`news.soverin.cloud`)
      traefik.http.routers.xsearch-news-public-v2.entrypoints: websecure
      traefik.http.routers.xsearch-news-public-v2.priority: "1"
      traefik.http.routers.xsearch-news-public-v2.tls: "true"
      traefik.http.routers.xsearch-news-public-v2.tls.certresolver: letsencrypt
      traefik.http.routers.xsearch-news-public-v2.service: xsearch-news

      traefik.http.routers.xsearch-news-private.rule: Host(`news.soverin.cloud`) && (PathPrefix(`/builder`) || PathPrefix(`/api`))
      traefik.http.routers.xsearch-news-private.entrypoints: websecure
      traefik.http.routers.xsearch-news-private.priority: "100"
      traefik.http.routers.xsearch-news-private.tls: "true"
      traefik.http.routers.xsearch-news-private.tls.certresolver: letsencrypt
      traefik.http.routers.xsearch-news-private.middlewares: xsearch-news-rate,xsearch-news-auth
      traefik.http.routers.xsearch-news-private.service: xsearch-news

      traefik.http.routers.xsearch-news-preflight.rule: Host(`news.soverin.cloud`) && Method(`OPTIONS`) && PathPrefix(`/api/import`)
      traefik.http.routers.xsearch-news-preflight.entrypoints: websecure
      traefik.http.routers.xsearch-news-preflight.priority: "200"
      traefik.http.routers.xsearch-news-preflight.tls: "true"
      traefik.http.routers.xsearch-news-preflight.tls.certresolver: letsencrypt
      traefik.http.routers.xsearch-news-preflight.service: xsearch-news

      traefik.http.middlewares.xsearch-news-auth.basicauth.users: ${XSEARCH_BASIC_AUTH:?XSEARCH_BASIC_AUTH is required}
      traefik.http.middlewares.xsearch-news-auth.basicauth.removeheader: "true"
      traefik.http.middlewares.xsearch-news-rate.ratelimit.average: "10"
      traefik.http.middlewares.xsearch-news-rate.ratelimit.burst: "20"
      traefik.http.middlewares.xsearch-news-rate.ratelimit.period: 1s
